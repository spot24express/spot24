# SPOT 24 · Netlify — build, SPA redirect y cabeceras de seguridad (sección 6.6)
# CSP estricta: sin scripts inline en producción. Dominios de Firebase/app y el
# hash del preamble de Vite (SOLO desarrollo) como únicas excepciones.

[build]
  # npm --prefix functions ci: el backend Lite (netlify/functions) importa el
  # código de functions/src, que resuelve firebase-admin/firebase-functions
  # desde functions/node_modules durante el bundling con esbuild.
  command = "npm install && npm --prefix functions ci && npm run build"
  publish = "dist"
  # Ahorro de créditos (plan por créditos: 15 por deploy a producción).
  # Si el push SOLO toca documentación (*.md, docs/, .github/, LICENSE),
  # `git diff --quiet` sale 0 → Netlify CANCELA el build → 0 créditos.
  # Si cambia CUALQUIER archivo de código, el diff (excluyendo docs) es
  # no-vacío → código != 0 → el build corre normal.
  # El `|| exit 1` falla seguro: ante cualquier error de git, el build SÍ corre.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude).github' ':(exclude)docs' ':(exclude)LICENSE' || exit 1"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "firebase-functions"]

# BCV: bcv.org.ve suele tardar más de 10 s en responder; el límite por defecto
# mataba la función antes del fetch (15 s interno) y nunca publicaba rates/bcv.
[functions."update-bcv-rate"]
  timeout = 26

# Disparo manual/cron (fn-runBcvRate): mismo motivo, el fetch interno tarda
# hasta 15 s y el límite por defecto (10 s) la mataría antes de responder.
[functions."fn-runBcvRate"]
  timeout = 26

# 5.75 · Reparación one-shot del stockTotal (fn-recomputeStock): con catálogos
# grandes lee variantes de todos los productos en tandas; 26 s = margen igual
# que el resto de funciones administrativas.
[functions."fn-recomputeStock"]
  timeout = 26

# 5.87 · Importar inventario (fn-importInventory): lee el PDF del POS (hasta
# 400 páginas), empareja por código y escribe en lotes; 26 s = margen igual
# que el resto de funciones administrativas (en producción corre en 1-5 s).
[functions."fn-importInventory"]
  timeout = 26

# 5.89 · Copias de seguridad del catálogo: exportar ensambla el catálogo y
# guardar/restaurar escriben snapshots en Firestore (la restauración además
# guarda la copia previa de seguridad); 26 s = margen igual que el resto.
[functions."fn-exportCatalog"]
  timeout = 26

[functions."fn-listCatalogBackups"]
  timeout = 26

[functions."fn-saveCatalogBackup"]
  timeout = 26

[functions."fn-restoreCatalog"]
  timeout = 26

[functions."backup-catalog"]
  timeout = 26

# Funciones de negocio (ronda 5.7): con la red del operador degradada (QUIC
# con pérdida de paquetes), cada llamada a Firestore tarda 17-28 s en
# `netlify dev` y el tope por defecto mataba la lambda → 500 SIN cuerpo
# («sin mensaje del servidor»). En producción corren en 1-3 s: el timeout
# solo es margen. El tope de Netlify es 26 s para funciones síncronas.
[functions."fn-getAdminMetrics"]
  timeout = 26

[functions."fn-quoteTotals"]
  timeout = 26

[functions."fn-reserveStock"]
  timeout = 26

[functions."fn-createOrder"]
  timeout = 26

[functions."fn-verifyPayment"]
  timeout = 26

[functions."fn-updateOrderStatus"]
  timeout = 26

[functions."fn-adjustStock"]
  timeout = 26

# 5.36 · Baja de usuario: hasta 6 llamadas seguidas a Firebase (getUser,
# lectura de tokens, batch, deleteUser, auditoría). Con la red del operador
# degradada, el tope por defecto (10 s) podía matarla a mitad del flujo.
[functions."fn-deleteUser"]
  timeout = 26

# 5.73 · Seguro del mandato de notificaciones: con el fix «await», estas 4
# funciones ESPERAN a que los push completen (lectura de tokens + FCM,
# +1-3 s) ANTES de responder. Con el tope por defecto (10 s) y la red del
# operador degradada (llamadas a Firestore de 17-28 s documentadas arriba),
# la lambda podía morir a mitad del flujo DESPUÉS de enviar el push: el
# cliente vería un error con la operación ya ejecutada. 26 s = mismo margen
# que el resto de las funciones de negocio (en producción corren en 1-3 s;
# el timeout solo es red de seguridad).
[functions."fn-cancelOrder"]
  timeout = 26

[functions."fn-uploadReceipt"]
  timeout = 26

[functions."fn-claimDeliveryOrder"]
  timeout = 26

[functions."fn-releaseDeliveryOrder"]
  timeout = 26

# ── Servidor de desarrollo local (netlify dev) ──
# netlify dev levanta las funciones de netlify/functions y, además, la app de
# Vite: `command` es lo que ejecuta y `targetPort` el puerto donde espera
# encontrarla. Nuestro `npm run dev` corre Vite en 3000 (package.json), NO en
# el 5173 por defecto de Vite: sin este bloque el CLI expira esperando 5173.
# Esta sección SOLO aplica al dev local; los builds de producción la ignoran.
[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 3000
  port = 8888
  autoLaunch = false

# ── Redirect SPA: todas las rutas a /index.html (200) ──
# force=false por defecto: los archivos estáticos de dist/ se sirven primero.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cabeceras globales de seguridad ──
# script-src: 'self' + dominios del SDK de Firebase/App Check (reCAPTCHA v3/Enterprise)
#   + hashes de los scripts inline que el SDK de Auth/reCAPTCHA inyecta dentro
#   de su iframe srcdoc (los iframes srcdoc heredan la CSP del sitio).
#   5.90.2: el SDK de Auth trajo un 4º script inline con hash NUEVO
#   (sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw=, aviso «about:srcdoc:85»
#   en consola) → añadido. Inocuo para la seguridad: es código del propio SDK.
#   + hash del «preamble» de React Refresh (sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk=).
#     ⚠️ Ese script inline SOLO existe en desarrollo: @vitejs/plugin-react lo inyecta en
#     la línea 4 del HTML servido por Vite, y `netlify dev` aplica ESTAS cabeceras también
#     en local → sin el hash, la CSP lo bloqueaba («can't detect preamble») y la pantalla
#     quedaba en blanco al recargar cualquier ruta (p. ej. «Ir al catálogo» desde el carrito).
#     En producción es inocuo: el bundle no contiene ningún script inline con ese hash.
#     Si una futura versión de Vite/plugin-react cambia el texto del preamble, el navegador
#     lo volverá a bloquear y la consola imprimirá el hash nuevo: cópialo aquí sustituyendo
#     el antiguo.
#    ⚠️ NOTA: «interest-cohort» se eliminó de esta cabecera: Chrome lo retiró
#    (FLoC fue reemplazado por Topics API) y emitía el aviso inofensivo
#    «Unrecognized feature: 'interest-cohort'» en la consola.
# frame-src: iframes del SDK de Auth (<authDomain>/__/auth/iframe) y de reCAPTCHA.
# style-src: 'self' 'unsafe-inline' — requerido por los atributos style de React;
#   la frontera dura está en script-src (nunca hay JS inline).
# connect-src: Firestore, Auth, Installations, App Check, Messaging y telemetría
#   de Firebase; las funciones de negocio viven en el mismo origen ('self').
#   + ws://localhost:3000 y ws://127.0.0.1:3000 — SOLO el HMR de Vite en
#     desarrollo: la página se abre vía el proxy de netlify dev (:8888) pero
#     el cliente de Vite conecta su websocket directo al servidor de Vite
#     (:3000, con token); sin esto la CSP lo bloqueaba («Connecting to
#     'ws://localhost:3000/?token=…' violates … connect-src») y los cambios
#     no se aplicaban en caliente — había que recargar con F5. En producción
#     es inocuo: nada conecta a un websocket localhost.
# img-src: 'self' data: blob: https: — las promos pueden apuntar a cualquier
#   host https (Storage, GitHub, el host que sea) sin tocar la CSP de nuevo.
# 5.90.2 · FIX «imágenes rotas» (causa raíz del reporte post-deploy del dueño):
#   el CacheFirst de i.ibb.co (5.75) hace que el SERVICE WORKER pida las fotos
#   con fetch() DENTRO de su propio contexto; ese fetch NO lo gobierna img-src
#   de la página sino connect-src de LA CSP QUE VIAJA CON sw.js (esta cabecera
#   global /* también cubre /sw.js — verificado en producción con curl).
#   Sin i.ibb.co en connect-src, toda imagen no-cacheada era rechazada:
#   «Refused to connect … violates CSP» → no-response → foto rota / «FOTO
#   PENDIENTE» en teléfono y PC desde que el lote 5.75 llegó a producción
#   (1ª visita sin SW seguía cargando: por eso el diagnóstico inicial falló).
#   → connect-src += https://i.ibb.co. Probado A/B con SW real: modo A 3/3
#   rotas, modo B 0/3.
#   → connect-src += https://firebasestorage.googleapis.com: la ruta CacheFirst
#   de Storage ya existía en el SW (vite.config); era una mina latente con la
#   misma mecánica. Hoy no hay imágenes de producto en Storage; si algún día
#   las hay, ya quedan cubiertas.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://www.google.com https://www.recaptcha.net 'sha256-Ob/z7smzKJGFdMGHiYHvik0pzOqdUCQ9Qa2zSrkvshs=' 'sha256-mTJ4cJaTm2Gw95GeXEpZdvEEY9ybh6FZu1bwcNE7QlY=' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk=' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; frame-src 'self' https://*.firebaseapp.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' blob: ws://localhost:3000 ws://127.0.0.1:3000 https://firestore.googleapis.com https://firebaseinstallations.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaselogging-pa.googleapis.com https://firebasemessaging.googleapis.com https://firebaseappcheck.googleapis.com https://www.google.com https://www.recaptcha.net https://apis.google.com https://fcmregistrations.googleapis.com https://i.ibb.co https://firebasestorage.googleapis.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), bluetooth=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"

# ── index.html nunca cacheado (el bundle referenciado cambia en cada deploy) ──
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Service worker y manifiesto siempre frescos ──
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache"

# ── SW de mensajería FCM: scope propio + nunca cacheado (ronda 5i-h) ──
# Se registra con scope /firebase-messaging/ para NO pisar al SW de la PWA
# (/sw.js, scope '/'): dos registros con el MISMO scope se reemplazan entre sí
# (ping-pong sw.js ↔ firebase-messaging-sw.js) y romperían el precache offline.
# Sin la cabecera Service-Worker-Allowed, el navegador rechaza el scope más
# ancho que la carpeta del script (SecurityError al activar notificaciones).
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# ── Assets con hash y fuentes woff2: caché inmutable en el CDN ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Deploy previews: apuntan a proyecto/alias Firebase separado vía variables ──
[context.deploy-preview.environment]
  NODE_ENV = "development"
  VITE_USE_STAGING_FIREBASE = "true"

[context.branch-deploy.environment]
  NODE_ENV = "development"
  VITE_USE_STAGING_FIREBASE = "true"